<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
  <g class="m-ink" fill="#1f3358">
    <!-- spear held at rest, point down, breaking the chain -->
    <g transform="rotate(42 32 32)">
      <rect x="30.6" y="0" width="2.8" height="46" rx="1.4"/>
      <circle cx="32" cy="0.8" r="2.6"/>
      <rect x="27.6" y="44.5" width="8.8" height="2.4" rx="1.2"/>
      <path d="M32 47.5 C28 51 28 55 32 63 C36 55 36 51 32 47.5 Z"/>
    </g>
    <!-- fallen crown, cracked -->
    <g transform="translate(-5 -3) rotate(-12 48 54)">
      <path d="M36 61 L36 51 L40 55 L43.6 48 L45.2 54 L45.2 61 Z"/>
      <path d="M47.4 61 L47.4 53 L49.5 48.5 L53 55 L57 51 L57 61 Z"/>
    </g>
  </g>
  <!-- broken chain link -->
  <g fill="none" stroke="#1f3358" stroke-width="2.6" stroke-linecap="round">
    <path d="M4 44 C2 50 6 55 10 53"/>
    <path d="M7 38 C11 34 16 37 15 42"/>
  </g>
  <g class="m-gold" fill="#9a7a2c" transform="translate(-5 -3) rotate(-12 48 54)">
    <circle cx="43.6" cy="46.3" r="1.5"/><circle cx="36" cy="49.4" r="1.3"/>
    <circle cx="49.5" cy="46.8" r="1.5"/><circle cx="57" cy="49.4" r="1.3"/>
  </g>
</svg>
